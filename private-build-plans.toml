[buildPlans.Monolite]      # Plan name (PascalCase recommended for v30+)
family = "Monolite"        # Font menu family name
spacing = "normal"               # Optional; Values: `normal`, `term`, `fontconfig-mono`, or `fixed`
serifs = "sans"                  # Optional; Values: `sans` or `slab`
webfontFormats = ['WOFF2']       # CHANGED: was `webfont-formats`, now camelCase + uppercase value

###################################################################################################
# Configure variants
# Iosevka Mayukai Config with base from Iosevka v4.x

# Optional; Whether to inherit a `ss##` variant
[buildPlans.Monolite.variants]
inherits = "ss17"

# Optional; Configure single character's variant
[buildPlans.Monolite.variants.design]
r = 'serifed'
zero = 'reverse-slashed'
one = 'base-long-top-serif'
eight = 'two-circles'
asterisk = 'penta-low'
brace = 'curly-flat-boundary'
number-sign = 'upright-tall'
at = 'threefold-tall'
paren = 'large-contour'
percent = 'rings-segmented-slash'
underscore = 'high'
punctuation-dot = 'round'
digit-form = 'lining'

# Optional; Configure single character's variant for Italic only; Overrides [design]
[buildPlans.Monolite.variants.italic]
r = 'corner-hooked-serifed'

# End variant section
###################################################################################################

###################################################################################################
# Configure ligations

[buildPlans.Monolite.ligations]
inherits = "default-calt"   # Optional; inherits an existing ligation set
disables = []               # Optional; disable specific ligation groups, overrides inherited ligation set
enables  = [
    "center-ops",
    "arrow",
    "arrow2",
    "trig",
    "eqeqeq",
    "eqeq",
    "ineq",
    "exeqeq",
    "exeq",
    "brst",
    "plusplus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]               # Optional; enable specific ligation groups, overrides inherited ligation set

# End ligation section
###################################################################################################


###################################################################################################
# Override default building weights
# When buildPlans.<plan name>.weights is absent, all weights would be built and mapped to
# default values.
# IMPORTANT : Currently "menu" and "css" property only support numbers between 0 and 1000.
#             and "shape" property only supports number between 100 and 900 (inclusive).
#             If you decide to use custom weights you have to define all the weights you
#             plan to use otherwise they will not be built.

# [buildPlans.Monolite.weights.Regular]
# shape = 400  # Weight for glyph shapes.
# menu  = 400  # Weight for the font's names.
# css   = 400  # Weight for webfont CSS.

# [buildPlans.Monolite.weights.Book]
# shape = 450
# menu  = 450  # Use 450 here to name the font's weight "Book"
# css   = 450

# [buildPlans.Monolite.weights.Bold]
# shape = 700
# menu  = 700
# css   = 700

# End weight section
###################################################################################################

###################################################################################################
# Override default building slope sets

[buildPlans.Monolite.slopes.Upright]
angle = 0             # Angle in degrees. Valid range [0, 15]
shape = "upright"     # Slope grade used for shape selection.  `upright` | `oblique` | `italic`
menu  = "upright"     # Slope grade used for naming.           `upright` | `oblique` | `italic`
css   = "normal"      # Slope grade used for webfont CSS.      `normal`  | `oblique` | `italic`

[buildPlans.Monolite.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"

# End slope section
###################################################################################################

###################################################################################################
# Override default building widths
# When buildPlans.<plan name>.widths is absent, all widths would be built and mapped to
# default values.
# IMPORTANT : Currently "shape" property only supports numbers between 434 and 664 (inclusive),
#             while "menu" only supports integers between 1 and 9 (inclusive).
#             The "shape" parameter specifies the unit width, measured in 1/1000 em.
#             If you decide to use custom widths you have to define all the widths you plan to use,
#             otherwise they will not be built.

# [buildPlans.Monolite.widths.Normal]
# shape = 500        # Unit Width, measured in 1/1000 em.
# menu  = 5          # Width grade for the font's names.
# css   = "normal"   # "font-stretch" property of webfont CSS.

# End width section
###################################################################################################

###################################################################################################
# Character Exclusion
# Specify character ranges in the section below to exclude certain characters from the font being
# built. Remove this section when this feature is not needed.

# [buildPlans.Monolite.exclude-chars]
# ranges = [[10003, 10008]]

# End character exclusion
###################################################################################################

###################################################################################################
# Compatibility Ligatures
# Certain applications like Emacs do not support proper programming ligatures provided by
# OpenType, but can support ligatures provided by PUA codepoints.

# [[buildPlans.Monolite.compatibility-ligatures]]
# unicode = 57600 # 0xE100
# featureTag = 'calt'
# sequence = '<*>'

# End compatibility ligatures section
###################################################################################################

###################################################################################################
# Metric overrides
# Certain metrics like line height (leading) could be overridden in your build plan file.
# Edit the values to change the metrics. Remove this section when overriding is not needed.

# [buildPlans.Monolite.metricOverride]
# leading = 1250
# winMetricAscenderPad = 0
# winMetricDescenderPad = 0
# powerlineScaleY = 1
# powerlineScaleX = 1
# powerlineShiftY = 0
# powerlineShiftX = 0

# End metric override section
###################################################################################################
