[buildPlans.Monolite]
family = "Monolite"
spacing = "normal"
serifs = "sans"
webfontFormats = ["WOFF2"]

###################################################################################################
# Configure variants
[buildPlans.Monolite.variants]
inherits = "ss17"

[buildPlans.Monolite.variants.design]
r = "serifed"
zero = "reverse-slashed"
one = "base-long-top-serif"
eight = "two-circles"
asterisk = "penta-low"
brace = "curly-flat-boundary"
number-sign = "upright-tall"
at = "threefold-tall"
paren = "large-contour"
percent = "rings-segmented-slash"
underscore = "high"
punctuation-dot = "round"
digit-form = "lining"

[buildPlans.Monolite.variants.italic]
r = "corner-hooked-serifed"

###################################################################################################
# Configure ligations - ✅ FIXED: arrow groups renamed to valid names
[buildPlans.Monolite.ligations]
inherits = "default-calt"
disables = []
enables = [
    "center-ops",
    # Arrow ligatures - menggunakan nama grup yang valid:
    "arrow-l",           # <-, <=, <==, etc.
    "arrow-r",           # ->, =>, ==>, etc.
    "arrow-lr",          # <->, <=>, etc.
    "arrow-equal",       # panah dengan rod =
    "arrow-hyphen",      # panah dengan rod -
    "trig",
    "eqeqeq",
    "eqeq",
    "ineq",
    "exeqeq",
    "exeq",
    "brst",
    "plusplus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]

###################################################################################################
# Override default building weights
# Uncomment & customize if needed:
# [buildPlans.Monolite.weights.Regular]
# shape = 400
# menu  = 400
# css   = 400

###################################################################################################
# Override default building slope sets
[buildPlans.Monolite.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.Monolite.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"

###################################################################################################
# Override default building widths
# Uncomment & customize if needed:
# [buildPlans.Monolite.widths.Normal]
# shape = 500
# menu  = 5
# css   = "normal"

###################################################################################################
# Character Exclusion
# Uncomment & customize if needed:
# [buildPlans.Monolite.exclude-chars]
# ranges = [[10003, 10008]]

###################################################################################################
# Compatibility Ligatures
# Uncomment & customize if needed:
# [[buildPlans.Monolite.compatibility-ligatures]]
# unicode = 57600
# featureTag = 'calt'
# sequence = '<*>'

###################################################################################################
# Metric overrides
# Uncomment & customize if needed:
# [buildPlans.Monolite.metricOverride]
# leading = 1250
# winMetricAscenderPad = 0
# winMetricDescenderPad = 0
# powerlineScaleY = 1
# powerlineScaleX = 1
# powerlineShiftY = 0
# powerlineShiftX = 0
