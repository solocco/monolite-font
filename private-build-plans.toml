[buildPlans.Monolite]
family = "Monolite"
spacing = "normal"
serifs = "sans"
webfontFormats = ["WOFF2"]

###################################################################################################
# Configure variants
[buildPlans.Monolite.variants]
inherits = "ss17"

[buildPlans.Monolite.variants.design]
r = "serifed"
zero = "reverse-slashed"
one = "base-long-top-serif"
eight = "two-circles"
asterisk = "penta-low"
brace = "curly-flat-boundary"
number-sign = "upright-tall"
at = "threefold-tall"
paren = "large-contour"
percent = "rings-segmented-slash"
underscore = "high"
punctuation-dot = "round"
digit-form = "lining"

[buildPlans.Monolite.variants.italic]
r = "corner-hooked-serifed"

###################################################################################################
# Configure ligations - ✅ FIXED: Only valid group names
[buildPlans.Monolite.ligations]
inherits = "default-calt"
disables = []
enables = [
    # === OPERATOR CENTERING ===
    "center-ops",
    "center-op-trigger-plus-minus-l",
    "center-op-trigger-plus-minus-r",
    "center-op-trigger-equal-l",
    "center-op-trigger-equal-r",
    "center-op-trigger-bar-l",
    "center-op-trigger-bar-r",
    "center-op-trigger-angle-inside",
    "center-op-trigger-angle-outside",
    "center-op-influence-dot",
    "center-op-influence-colon",

    # === ARROWS (valid names) ===
    "arrow-l",           # <-, <=, <==, dll
    "arrow-r",           # ->, =>, ==>, dll
    "arrow-lr",          # <->, <=>, dll
    "arrow-equal",       # panah dengan rod =
    "arrow-hyphen",      # panah dengan rod -
    "arrow-wave",        # panah dengan rod ~

    # === EQUALITY / INEQUALITY ===
    "eqeqeq",            # === dengan triple lines
    "eqeq",              # == dan ===
    "lteq",              # <= sebagai ≤
    "gteq",              # >= sebagai ≥
    "exeq",              # != dan !==
    "tildeeq",           # ~= sebagai ≠
    "slasheq",           # /= dan =/=

    # === TRIANGLES / BRACKETS ===
    "trig",              # <|, |>, <||, dll
    "llgg",              # <<, >>, <<<, >>>
    "llggeq",            # <<=, >>= sebagai shift

    # === COMMENT SYMBOLS ===
    "brst",              # (* dan *)
    "html-comment",      # <!-- dan -->

    # === KERNING / SPACING ===
    "kern-dotty",        # ::, :::, ...
    "kern-bars",         # ||, |||, //

    # === LOGIC / MISC ===
    "logic",             # /\, \/, |-, -|

    # === CONNECTION (repeated chars) ===
    "plusplus",          # ++, +++
    "minus-minus",       # --, ---
    "tilde-tilde",       # ~~, ~~~
    "underscore-underscore",  # __, ___
    "hash-hash"          # ##, ###
]

###################################################################################################

[buildPlans.Monolite.weights.Regular]
shape = 415
menu = 400
css = 400
[buildPlans.Monolite.weights.Bold]
shape = 700
menu = 700
css = 700
[buildPlans.Monolite.weights.Medium]
shape = 510
menu = 500
css = 500
[buildPlans.Monolite.widths.Normal]
shape = 604
menu = 5
css = "normal"

# Slopes
[buildPlans.Monolite.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.Monolite.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"
