[buildPlans.Monolite]
family = "Monolite"
spacing = "normal"
serifs = "sans"
webfontFormats = ["WOFF2"]

###################################################################################################
[buildPlans.Monolite.variants]
inherits = "ss17"

[buildPlans.Monolite.variants.design]
r = "serifed"
zero = "reverse-slashed"
one = "base-long-top-serif"
eight = "two-circles"
asterisk = "penta-low"
brace = "curly-flat-boundary"
number-sign = "upright-tall"
at = "threefold-tall"
paren = "large-contour"
percent = "rings-segmented-slash"
underscore = "high"
punctuation-dot = "round"
digit-form = "lining"

[buildPlans.Monolite.variants.italic]
r = "corner-hooked-serifed"

###################################################################################################
[buildPlans.Monolite.ligations]
inherits = "default-calt"
disables = []
enables  = [
    "center-ops",
    "arrow-l-hyphen",
    "arrow-r-hyphen",
    "arrow-lr-hyphen",
    "arrow-l-equal",
    "arrow-r-equal",
    "arrow-lr-equal",
    "trig",
    "eqeqeq",
    "eqeq",
    "lteq",
    "gteq",
    "exeqeq",
    "exeq",
    "brst",
    "plus-plus",
    "kern-dotty",
    "kern-bars",
    "logic",
    "llgg",
    "llggeq",
    "html-comment"
]

###################################################################################################
[buildPlans.Monolite.weights.Regular]
shape = 400
menu = 400
css = 400
[buildPlans.Monolite.weights.Bold]
shape = 700
menu = 700
css = 700
[buildPlans.Monolite.weights.Medium]
shape = 500
menu = 500
css = 500
[buildPlans.Monolite.widths.Normal]
shape = 600
menu = 5
css = "normal"

###################################################################################################
[buildPlans.Monolite.slopes.Upright]
angle = 0
shape = "upright"
menu  = "upright"
css   = "normal"

[buildPlans.Monolite.slopes.Italic]
angle = 9.4
shape = "italic"
menu  = "italic"
css   = "italic"
